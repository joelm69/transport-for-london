# Single-node Kafka (KRaft: broker and controller in one process, no ZooKeeper) for the
# arrivals pipeline on the 1 GB e2-micro. Settings match the Docker rehearsal in
# docker/kafka_test/compose.yaml (measured 2026-10-22). Reachable from this machine only.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@127.0.0.1:9093
listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
advertised.listeners=PLAINTEXT://127.0.0.1:9092
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

log.dirs=/var/lib/kafka/data
num.partitions=1
auto.create.topics.enable=true

# One node: no replication possible.
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0

# A buffer, not the archive (GCS is): keep 2 hours, at most ~250 MB per partition.
log.retention.ms=7200000
log.retention.bytes=250000000
log.segment.bytes=52428800
log.retention.check.interval.ms=60000

# Small-machine settings. The log cleaner reserves 128 MB of heap by default; only the
# consumer-offsets topic is compacted here. Kafka failed to start with a 192 MB heap without this.
log.cleaner.dedupe.buffer.size=8388608
num.network.threads=2
num.io.threads=2
num.recovery.threads.per.data.dir=1
